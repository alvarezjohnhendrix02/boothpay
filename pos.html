<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A7A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ContactSheet">
<title>ContactSheet · Register</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<header class="topbar">
  <div class="sprocket" aria-hidden="true"></div>
  <div class="topbar-in">
    <div class="who-block"><span id="boothBadge"></span><div style="min-width:0"><p class="name" id="boothName"></p><p class="sub" id="eventName"></p></div></div>
    <span class="chip" id="saved" aria-live="polite"></span>
    <button class="icon-btn" id="signout" aria-label="Sign out" title="Sign out"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="sell"></button>
    <button role="tab" aria-selected="false" data-tab="today"></button>
  </nav>
</header>

<main class="pos-main">
  <section id="tab-sell">
    <p class="howto"><span><b>1</b>Tap what they're buying</span><span><b>2</b>Press Charge</span><span><b>3</b>Get the money</span></p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="tab-today" class="today" hidden></section>
  <aside class="cart-side" aria-label="Current sale">
    <p class="h2">This sale</p>
    <div class="cart-body"></div>
  </aside>
</main>

<div class="cartbar" id="cartbar" hidden>
  <button class="btn go" data-open-cart><span id="cartCount"></span><span id="cartTotal" class="num"></span></button>
</div>

<dialog class="sheet" id="sheet"><div class="sheet-in"></div></dialog>

<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/csv.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/pwa.js"></script>
<script src="js/pos.js"></script>
</body>
</html>
